name: Publish

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
      # Build once into the local daemon (cached) so the deploy chain can be smoke-tested before publishing.
      # Same labels as the publish build below so the smoke-tested image config matches what gets pushed.
      - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          load: true
          tags: viraloderegal:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The smoke test below sets PORT and WEB_DIST_DIR in the compose environment: block, so it can never
      # catch the image losing its own defaults. Assert those against the built image config, since a
      # deployment that overrides neither (and the EXPOSE the Dockerfile advertises) depends on them.
      - name: Assert the image's declared defaults
        run: |
          config=$(docker image inspect viraloderegal:ci --format '{{json .Config}}')
          for pair in PORT=3000 WEB_DIST_DIR=/app/web NODE_ENV=production; do
            echo "$config" | jq -e --arg p "$pair" '.Env | index($p)' > /dev/null \
              || { echo "image is missing ENV $pair"; exit 1; }
          done
          echo "$config" | jq -e '.ExposedPorts["3000/tcp"]' > /dev/null \
            || { echo "image is missing EXPOSE 3000"; exit 1; }
      # Run the built image through the prod compose against a throwaway Postgres: proves the entrypoint's
      # deploy chain (tsx + dist/db/migrate.js + bundled migrations) runs and the app reports healthy.
      - name: Smoke-test the deploy chain
        run: |
          cat > .env <<'EOF'
          POSTGRES_USER=viraloderegal
          POSTGRES_PASSWORD=viraloderegal
          POSTGRES_DB=viraloderegal
          DATABASE_URL=postgres://viraloderegal:viraloderegal@postgres:5432/viraloderegal
          NODE_ENV=production
          VIRALODEREGAL_IMAGE=viraloderegal:ci
          # The values a .env copied from .env.example carries. Both are wrong inside the image, so this
          # asserts the compose environment: block still outranks env_file rather than testing the default.
          PORT=18752
          WEB_DIST_DIR=../web/dist
          BETTER_AUTH_SECRET=ci-smoke-better-auth-secret-0123456789
          BETTER_AUTH_URL=http://localhost:18752
          MAIL_TRANSPORT=json
          SMTP_HOST=localhost
          SMTP_PORT=587
          SMTP_USER=viraloderegal
          SMTP_PASSWORD=viraloderegal
          SMTP_FROM=Viral oder Egal <noreply@viraloderegal.de>
          BOOTSTRAP_ADMIN_EMAIL=admin@viraloderegal.de
          BOOTSTRAP_ADMIN_PASSWORD=viraloderegal-bootstrap
          EOF
          # Tear the stack down even if the health wait or curl fails, so nothing is left running.
          trap 'docker compose -f docker-compose.prod.yml down -v' EXIT
          docker compose -f docker-compose.prod.yml up -d --wait --wait-timeout 120
          curl -fsS http://localhost:18752/health
      # Re-run with push (fully cached from the build above) to publish the real tags only after the smoke test passed.
      - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
